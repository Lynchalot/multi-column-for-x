<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi-Column for X</title>
  <link rel="stylesheet" href="options.css">
</head>
<body class="popup">
  <div id="access" class="access" role="alert" hidden></div>
  <div class="shell">
    <nav id="nav" hidden></nav>
    <main>
      <div class="top">
      <header>
        <h1><img class="logo" src="icons/icon.svg" alt="" width="28" height="28"><span>Multi-Column for X</span>
          <button id="open-full" type="button" class="full" title="Open the settings in a tab">All settings</button><button id="close-panel" type="button" class="full" title="Close (Esc)" hidden>Close</button></h1>
        <p id="support" class="support" hidden></p>
      </header>
      <label class="master" title="Turn the extension off and on"><input type="checkbox" id="opt-enabled" role="switch" checked><span class="knob" aria-hidden="true"></span><span class="mlabel">Enabled</span></label>
      <p id="here" class="here" role="status" hidden></p>
      <div class="find" role="search">
        <input id="opt-search" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off" spellcheck="false">
        <label class="only"><input type="checkbox" id="only-changed"><span>Only changed (<span id="changed-count">0</span>)</span></label>
        <span id="find-status" class="muted" role="status" aria-live="polite"></span>
      </div>
      </div>
      <div id="sections"></div>
      <p class="muted" id="status" role="status"></p>
    </main>
  </div>
  <script src="src/settings.js"></script>
  <script src="src/meta.js"></script>
  <script src="src/logic.js"></script>
  <script src="options.js"></script>
</body>
</html>
