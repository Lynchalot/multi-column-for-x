<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi-Column for X — Settings</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="shell">
    <nav id="nav"></nav>
    <main>
      <header>
        <h1><img class="logo" src="icons/icon.svg" alt="" width="40" height="40"><span>Multi-Column for X</span></h1>
        <p id="support" class="support" hidden></p>
      </header>
      <div class="find" role="search">
        <input id="opt-search" type="search" placeholder="Search settings   ( / )" aria-label="Search settings" autocomplete="off" spellcheck="false">
        <label class="only"><input type="checkbox" id="only-changed"><span>Only changed (<span id="changed-count">0</span>)</span></label>
        <span id="find-status" class="muted" role="status" aria-live="polite"></span>
      </div>
      <div id="sections"></div>
      <section id="history-section" data-nav="Download history">
        <h2>Download history</h2>
        <p class="muted" id="history-summary"></p>
        <div class="row"><button id="history-clear" type="button">Clear history</button></div>
        <ul id="history-list"></ul>
      </section>
      <section id="data-section" data-nav="Backup & reset">
        <h2>Backup &amp; reset</h2>
        <div class="row">
          <button id="export" type="button">Export settings</button>
          <label class="button">Import settings<input id="import" type="file" accept="application/json" hidden></label>
          <button id="reset" type="button" class="danger">Reset all settings</button>
        </div>
        <p class="muted" id="status" role="status"></p>
      </section>
    </main>
  </div>
  <script src="src/settings.js"></script>
  <script src="src/meta.js"></script>
  <script src="src/logic.js"></script>
  <script src="options.js"></script>
</body>
</html>
