name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e   # the real extension scripts in headless Chrome against a stand-in x.com
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: extension, path: web-ext-artifacts/*.zip }
