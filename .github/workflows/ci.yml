name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: End-to-end tests (the real extension scripts in headless Chrome against a stand-in x.com)
        run: |
          set +e
          npm run test:e2e 2>&1 | tee e2e.log
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            # the job log is not always readable from outside: put what failed in an annotation
            msg=$(grep -E "^not ok|^ +error:|^ +[+-] |Timeout|expected|actual" e2e.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=e2e failed::${msg}"
          fi
          exit $code
      - run: npm run lint
      - run: npm run build
      - run: npm run build:chrome
      - name: Chrome package (the built extension, loaded into Chromium against the stand-in)
        run: |
          set +e
          npx --yes playwright-core install --with-deps chromium
          npm run test:chrome 2>&1 | tee chrome.log
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            msg=$(grep -E "^not ok|^ +error:|Timeout|expected|actual" chrome.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=chrome package failed::${msg}"
          fi
          exit $code
      - name: Firefox package (the built extension, installed into the runner's Firefox through geckodriver, against the stand-in)
        run: |
          set +e
          firefox --version; geckodriver --version | head -1
          npm run test:firefox 2>&1 | tee firefox.log
          code=${PIPESTATUS[0]}
          echo "::notice title=firefox package::$(firefox --version) $(grep -E '^# (pass|fail|skipped)' firefox.log | tr '\n' ' ')"
          if [ "$code" != 0 ]; then
            msg=$(grep -E "^not ok|^ +error:|timed out|expected|actual" firefox.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=firefox package failed::${msg}"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with: { name: extension, path: web-ext-artifacts/*.zip }
